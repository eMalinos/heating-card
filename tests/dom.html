<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>heating-card DOM checks</title>
<style id="page">body{margin:0;padding:16px;background:#efefef;font-family:Roboto,system-ui,sans-serif}</style>
</head>
<body>
<!--
  Browser checks with a fake hass (tests/fixtures/states.json + 5 more valves, like design V5). Run:
  python3 -m http.server 8766 &
  "Google Chrome" --headless=new --virtual-time-budget=30000 --dump-dom http://localhost:8766/tests/dom.html | grep RESULT
  Looks (?theme=): none = HA fallbacks (light), homecraft = Homecraft tokens (Břidlice light), dark = Břidlice dark tokens, e.g.
  "Google Chrome" --headless=new --virtual-time-budget=30000 --window-size=512,900 --screenshot=docs/card.png "http://localhost:8766/tests/dom.html?shot=1&theme=homecraft"
-->
<div id="box" style="width:480px"></div>
<pre id="out"></pre>
<script type="module">
  const errors = [];
  addEventListener('error', (e) => errors.push(e.message));
  const origError = console.error;
  console.error = (...a) => { errors.push(a.join(' ')); origError(...a); };

  const q = new URLSearchParams(location.search);
  const THEMES = {
    homecraft: '--hfb-card:#fff;--hfb-border:#DFE3E8;--hfb-fill:#F0F2F5;--hfb-text:#1C2128;--hfb-text-2:#6E7682;--hfb-accent:#4F6B8C;--hfb-card-radius:20px;--hfb-card-shadow:0 1px 4px rgba(0,0,0,.06);--hfb-btn-raised-bg:#fff;--hfb-btn-raised-shadow:0 1px 3px rgba(0,0,0,.1);--hfb-seg-track:#F0F2F5;--hfb-seg-on:#fff;--hfb-seg-on-shadow:0 1px 3px rgba(0,0,0,.1);--hfb-seg-on-color:#1C2128;--hfb-dot-idle:#fff;--hfb-hot-tile:color-mix(in srgb,#E8592C 8%,#F0F2F5);--hfb-run-dot:linear-gradient(145deg,color-mix(in srgb,#4F6B8C 65%,#fff),#4F6B8C);--hfb-run-glow:0 2px 6px color-mix(in srgb,#4F6B8C 40%,transparent);--success-color:#1E7A46;--info-color:#4F6B8C;--error-color:#E5484D;--disabled-text-color:#A9AFB7',
    dark: '--hfb-card:#181C22;--hfb-border:#262C35;--hfb-fill:#21262E;--hfb-text:#E9EDF2;--hfb-text-2:#949CA8;--hfb-accent:#86A9D1;--hfb-card-radius:20px;--hfb-card-shadow:0 1px 4px rgba(0,0,0,.4);--hfb-btn-raised-bg:#181C22;--hfb-btn-raised-shadow:0 1px 3px rgba(0,0,0,.5);--hfb-seg-track:#21262E;--hfb-seg-on:#181C22;--hfb-seg-on-shadow:0 1px 3px rgba(0,0,0,.5);--hfb-seg-on-color:#E9EDF2;--hfb-dot-idle:#181C22;--hfb-hot-tile:color-mix(in srgb,#E8592C 10%,#21262E);--hfb-run-dot:linear-gradient(145deg,color-mix(in srgb,#86A9D1 65%,#fff),#86A9D1);--hfb-run-glow:0 2px 6px color-mix(in srgb,#86A9D1 40%,transparent);--success-color:#5FD08F;--info-color:#86A9D1;--error-color:#FF8A80;--disabled-text-color:#5C636D',
  };
  const theme = q.get('theme');
  if (THEMES[theme]) document.documentElement.style.cssText = THEMES[theme];
  document.body.style.background = theme === 'dark' ? '#0F1216' : theme === 'homecraft' ? '#ECEEF1' : '#efefef';

  // a stand-in for heating-schedule-card (a separate repo): records its config
  customElements.define('heating-schedule-card', class extends HTMLElement { setConfig(c) { this.cfg = c; } });
  await import('../dist/heating-card.js');

  const C = 'circuit_demo';
  const fixture = await (await fetch('./fixtures/states.json')).json();
  const states = structuredClone(fixture);
  const set = (id, state, attributes = {}) => { states[id] = { state, attributes: { ...states[id]?.attributes, ...attributes } }; };
  // the design's eight valves (V5-Main)
  const ids = {};
  const mk = (key, name, now, target, extra = {}) => {
    ids[key] = `climate.${key}`;
    states[ids[key]] = { state: 'heat', attributes: { friendly_name: name, current_temperature: now, temperature: target, min_temp: 5, max_temp: 30, ...extra } };
  };
  mk('living', 'Obývák', 20.4, 21); mk('workroom', 'Pracovna', 18.9, 20.5); mk('hallway', 'Chodba', 19.2, 19);
  mk('kitchen', 'Kuchyň', 21.2, 21); mk('bedroom', 'Ložnice', 18.6, 18); mk('kids', 'Dětský pokoj', 19.6, 21);
  mk('bath', 'Koupelna', 22.6, 23); mk('dressing', 'Šatna', 18.4, 19);
  const valveIds = Object.values(ids);
  const phases = Object.fromEntries(valveIds.map((v) => [v, ['normal']]));
  phases[ids.workroom] = ['fast']; phases[ids.hallway] = ['run']; phases[ids.bedroom] = ['closed'];
  set(`sensor.heating_valves_${C}`, '3', { phases, demand: [ids.living, ids.workroom, ids.bath], left: 0 });
  set(`sensor.heating_off_schedule_${C}`, '2', { window_open_climates: [ids.kids] });
  set(`sensor.heating_low_batteries_${C}`, '3', { low_battery: [
    { climate: ids.bath, source: 'valve', state: 9 },
    { climate: ids.dressing, source: 'valve', state: 14 }, { climate: ids.dressing, source: 'window', state: 8 }] });
  set(`input_text.heating_status_${C}`, 'success|Program Víkend nastaven na všech 8 hlavic.');
  set(`sensor.heating_program_${C}`, 'weekend', { program_names: { weekend: 'Víkend', home_office: 'Home office', sick: 'Nemoc' } });
  states[`sensor.heating_program_${C}`].last_changed = new Date().toISOString();
  set(`select.heating_program_${C}`, 'weekend', { options: ['auto', 'weekend', 'home_office', 'vacation', 'sick'] });
  set(`sensor.heating_outdoor_temperature_${C}`, '6.2');
  set(`binary_sensor.heating_state_${C}`, 'on', { title: 'Topení přízemí' });

  // valve dialog data: Šatna = low batteries + two window sensors, Dětský pokoj = window open 12 min, reminder 30
  const sensor = (id, state, attributes = {}) => { states[id] = { state, attributes }; };
  sensor('sensor.dress_battery', '14', { device_class: 'battery' }); sensor('sensor.dress_signal', '-71', { device_class: 'signal_strength' });
  sensor('sensor.dress_valve_position', '12'); sensor('binary_sensor.dress_calibration', 'off');
  sensor('sensor.balkon_battery', '8', { device_class: 'battery' }); sensor('sensor.kuchyn_battery', '85', { device_class: 'battery' });
  sensor('sensor.kids_battery', '82', { device_class: 'battery' }); sensor('sensor.kids_valve_position', '0');
  sensor('binary_sensor.balkon', 'off'); sensor('binary_sensor.kuchyn', 'off'); sensor('binary_sensor.kids_window', 'on');
  const entities = {};
  for (const id of [ids.dressing, 'sensor.dress_battery', 'sensor.dress_signal', 'sensor.dress_valve_position', 'binary_sensor.dress_calibration']) entities[id] = { device_id: 'dress' };
  for (const id of [ids.kids, 'sensor.kids_battery', 'sensor.kids_valve_position']) entities[id] = { device_id: 'kids' };
  const since = new Date(Date.now() - 12 * 60000).toISOString();
  const old = '2026-11-01T08:00:00Z';
  set(`sensor.heating_off_schedule_${C}`, '2', { window_open_climates: [ids.kids], windows: {
    [ids.dressing]: [{ entity_id: 'binary_sensor.balkon', name: 'Okno balkon', state: 'off', open: false, since: old, battery: 'sensor.balkon_battery' },
      { entity_id: 'binary_sensor.kuchyn', name: 'Okno kuchyň', state: 'off', open: false, since: old, battery: 'sensor.kuchyn_battery' }],
    [ids.kids]: [{ entity_id: 'binary_sensor.kids_window', name: 'Okno dětský pokoj', state: 'on', open: true, since, battery: null }] } });
  set(`sensor.heating_low_batteries_${C}`, '3', { list_low: [{ name: 'Šatna', source: 'valve', state: 14, climates: [ids.dressing] }, { name: 'Okno balkon', source: 'window', state: 8, climates: [ids.dressing] }] });
  sensor(`input_number.heating_window_reminder_${C}`, '30');
  const wsCalls = [];
  const callWS = async (msg) => {
    wsCalls.push(msg);
    const end = Date.now(), h = (n) => (end - n * 3600000) / 1000;
    return Object.fromEntries(msg.entity_ids.map((id) => [id, id.startsWith('climate.')
      ? [{ lu: h(24), a: { current_temperature: 19, temperature: 18 } }, { lu: h(10), a: { current_temperature: 20.5, temperature: 21 } }, { lu: h(1), a: { current_temperature: 19.6 } }]
      : (id === 'binary_sensor.kids_window' ? [{ lu: h(24), s: 'on' }] : [{ lu: h(24), s: 'off' }])]));
  };
  const confirms = [];
  window.confirm = (m) => { confirms.push(m); return true; };

  const calls = [];
  const infos = [];
  const hass = { states, entities, callWS, callService: async (domain, service, data) => { calls.push({ domain, service, data }); } };
  const cfg = { circuit: C, valves: valveIds };

  const card = document.createElement('heating-card');
  card.setConfig(cfg);
  card.hass = hass;
  card.addEventListener('hass-more-info', (e) => infos.push(e.detail.entityId));
  document.getElementById('box').appendChild(card);
  const root = card.shadowRoot;
  const tick = (ms = 30) => new Promise((r) => setTimeout(r, ms));
  const $ = (s) => root.querySelector(s);
  const $$ = (s) => [...root.querySelectorAll(s)];
  const ptr = (el, type) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, composed: true }));
  const press = async (el, ms = 0) => { ptr(el, 'pointerdown'); if (ms) await tick(ms); ptr(el, 'pointerup'); };
  await tick(100);

  // ?vd=dress|kids opens that valve's dialog (screenshots of the two V4 boards)
  if (q.get('vd')) { await press($$('.main')[q.get('vd') === 'kids' ? 5 : 7].querySelector('.dot')); await tick(200); }
  // ?pd=1 opens the program dialog (screenshot of V6-Program), with the applying alert
  if (q.get('pd')) {
    card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'program', left: 4 } } } };
    await tick(); $('[data-act="open"][data-val="program"]').click(); await tick(200);
  }
  if (q.get('shot')) { document.getElementById('out').remove(); throw 'shot'; }

  const r = {};
  r.twoBoxes = $$('.card').length === 2 && $$('.tile').length === 8;
  r.header = $('h2').textContent === 'Topení přízemí' && $('.sub').textContent === 'Kotel topí · 3 hlavice chtějí teplo' && $('.live b').textContent === '6,2';
  r.status = $('.alert.success span').textContent.startsWith('Program Víkend') && !!$('.alert [data-act="clear"]');
  r.mode = $('.seg .on').dataset.val === 'on' && $$('.seg button').length === 3;
  r.panel = $$('.facts .v')[0].textContent === 'Víkend' && $$('.facts .v')[1].textContent.replace(/\s+/g, ' ').trim() === '2 hlavice';
  r.phases = $$('.tile').map((t) => t.dataset.phase).join() === 'heat,fast,run,idle,closed,window,heat,idle';
  r.tileLooks = $$('.tile.hot').length === 3 && $$('.tile.off').length === 1 && $$('.flame').length === 4 && $$('.badge').length === 2; // 3 hot tiles + header flame
  r.states = $$('.tile .state').map((s) => s.textContent).join('|') === 'Topí · 20,4 °C|Rychlý start · 18,9 °C|Doběh · 19,2 °C|Nečinný · 21,2 °C|Zavřeno · 18,6 °C|Okno otevřené · 19,6 °C|Baterie 9 %|Hlavice 14 % · okno 8 %';
  r.summary = $('.head2 .sub').textContent === '3 topí · 1 okno · 2 baterie';
  r.disabledTile = $$('.tile')[5].querySelectorAll('.pm:disabled').length === 2 && $$('.tile')[0].querySelectorAll('.pm:disabled').length === 0;
  r.targets = $$('.tile .val')[1].textContent.replace(/\s/g, ' ') === '20,5 °C';

  // actions
  $('[data-act="mode"][data-val="off"]').click(); await tick();
  r.modeCall = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_select', service: 'select_option', data: { entity_id: `input_select.heating_mode_${C}`, option: 'off' } });
  $('[data-act="clear"]').click(); await tick();
  r.clearCall = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_text', service: 'set_value', data: { entity_id: `input_text.heating_status_${C}`, value: '' } });
  $('[data-act="sync"]').click(); await tick();
  r.syncCall = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_button', service: 'press', data: { entity_id: `input_button.heating_sync_${C}` } });
  const living = $$('.tile')[0];
  $$('.tile')[0].querySelector('[data-d="1"]').click(); await tick();
  r.plusCall = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'climate', service: 'set_temperature', data: { entity_id: ids.living, temperature: 21.5 } });
  // quick taps add up while hass still reports 21: 21.5, 22, then back to 21.5; the tile shows the pending value
  $$('.tile')[0].querySelector('[data-d="1"]').click(); await tick();
  r.plusPlus = calls.at(-1).data.temperature === 22 && $$('.tile .val')[0].textContent.replace(/\s/g, ' ') === '22,0 °C';
  $$('.tile')[0].querySelector('[data-d="-1"]').click(); await tick();
  r.minusCall = calls.at(-1).data.temperature === 21.5;
  await tick(5200); // pending expires: back to what hass reports
  r.pendingExpires = $$('.tile .val')[0].textContent.replace(/\s/g, ' ') === '21,0 °C';
  const nCalls = calls.length;
  $$('.tile')[5].querySelector('[data-d="1"]').click(); await tick();
  r.disabledNoCall = calls.length === nCalls;

  // hass updates re-render: sync spins while applying, the cross is gone with the message
  card.hass = { ...hass, states: { ...states, [`input_text.heating_status_${C}`]: { state: '', attributes: {} },
    [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'sync', left: 4, pending: [] } } } };
  await tick();
  r.liveUpdate = !$('.alert') && !!$('[data-act="sync"] .spin') && $('[data-act="sync"]').disabled;
  card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'program', left: 4 } } } };
  await tick();
  r.programApplying = $$('.facts .v')[0].textContent.includes('Nastavuji… 4') && !$('[data-act="sync"]').disabled;
  card.hass = hass; await tick();

  // an unrelated hass update rebuilds nothing; a change of one valve patches only its tile
  const tile0 = $$('.tile')[0], tile1 = $$('.tile')[1], flame1 = tile1.querySelector('.flame'), box1 = $('[data-p="box1"] .head');
  card.hass = { ...hass, states: { ...states, 'sensor.unrelated': { state: '1', attributes: {} } } }; await tick();
  r.noRebuild = $$('.tile')[0] === tile0 && $('[data-p="box1"] .head') === box1;
  card.hass = { ...hass, states: { ...states, [ids.living]: { ...states[ids.living], attributes: { ...states[ids.living].attributes, current_temperature: 20.9 } } } }; await tick();
  r.patchOne = $$('.tile')[0] !== tile0 && $$('.tile')[1] === tile1 && tile1.querySelector('.flame') === flame1 && $$('.tile .state')[0].textContent === 'Topí · 20,9 °C';
  // while a pointer is down the render waits for pointerup
  const dn = $$('.main')[1];
  ptr(dn, 'pointerdown');
  card.hass = { ...hass, states: { ...states, [ids.workroom]: { ...states[ids.workroom], attributes: { ...states[ids.workroom].attributes, current_temperature: 19.5 } } } }; await tick();
  r.deferred = $$('.tile .state')[1].textContent === 'Rychlý start · 18,9 °C' && $$('.main')[1] === dn;
  ptr(dn, 'pointerup'); await tick();
  r.flushed = $$('.tile .state')[1].textContent === 'Rychlý start · 19,5 °C';
  await tick(300); // the tap above opens nothing pending; close a dialog it may have opened
  if ($('dialog').open) $('dialog').close();
  card.hass = hass; await tick();

  // gestures: default = tap on the tile opens the schedule dialog, tap on the icon circle fires more-info
  const m0 = () => $$('.main')[0];
  await press(m0()); await tick();
  const dlg = $('dialog');
  const sched = dlg.querySelector('heating-schedule-card');
  r.tapSchedule = dlg.open && JSON.stringify(sched?.cfg) === JSON.stringify({ valve: ids.living, circuits: [{ id: C, valves: valveIds }], time_step: 15 }) && sched.hass === hass;
  dlg.close(); await tick();
  await press(m0().querySelector('.dot')); await tick();
  const vd = $('dialog.vd');
  r.iconInfo = vd.open && vd.querySelector('.vd-title').textContent === 'Obývák' && !dlg.open && infos.length === 0;
  vd.close(); await tick();

  // hold and double tap
  card.setConfig({ ...cfg, schedule_gesture: 'hold', info_gesture: 'double_tap' });
  await press(m0()); await tick(350);
  const nInfo = infos.length;
  r.tapNothing = !dlg.open && !vd.open && infos.length === nInfo;
  await press(m0(), 650); await tick();
  r.holdSchedule = dlg.open;
  dlg.close(); await tick();
  await press(m0()); await press(m0()); await tick(400);
  r.doubleTapOnce = vd.open && vd.querySelector('.vd-title').textContent === 'Obývák';
  vd.close(); await tick();
  card.setConfig({ ...cfg, schedule_gesture: 'icon_hold', info_gesture: 'none' });
  await press(m0().querySelector('.dot'), 650); await tick();
  r.iconHold = dlg.open;
  dlg.close(); await tick();

  // keyboard: Enter / Space on the text run schedule, on the icon button info, whatever the gestures are
  card.setConfig({ ...cfg, schedule_gesture: 'hold', info_gesture: 'double_tap' });
  const key = (el, k) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, composed: true, cancelable: true }));
    const txt = root.querySelector('.txt[role="button"]');
  key(txt, 'Enter'); await tick();
  r.keySchedule = dlg.open;
  dlg.close(); await tick();
  const iconBtn = root.querySelector('button.dot');
  r.iconIsButton = iconBtn.getAttribute('aria-label') === 'Detail Obývák';
  key(iconBtn, ' '); await tick();
  r.keyInfo = vd.open;
  vd.close(); await tick();
  card.setConfig({ ...cfg, schedule_gesture: 'none', info_gesture: 'none' });
  r.noneNoControls = !root.querySelector('button.dot') && !root.querySelector('.txt[role="button"]');
  key(root.querySelector('.txt'), 'Enter'); await tick();
  r.noneNoAction = !dlg.open && !vd.open;

  // valve dialog: battery board (Šatna)
  card.setConfig(cfg); card.hass = hass; await tick();
  const dress = $$('.main')[7];
  await press(dress.querySelector('.dot')); await tick(100);
  const t = (sel) => vd.querySelector(sel)?.textContent.replace(/\s+/g, ' ').trim();
  r.vdBattery = vd.open && t('.vd-title') === 'Šatna' && t('.vd-alert') === 'Vyměň baterie (2) · hlavice 14 %, okno balkon 8 %' && !!vd.querySelector('.vd-head .badge.blink')
    && vd.querySelector('.vd-tile.low .fv').textContent === '14 %' && t('.vd-win .wn') === 'Okno balkon';
  r.vdFacts = [...vd.querySelectorAll('.vd-tile .fv')].map((e) => e.textContent).join('|') === '14 %|−71 dBm|12 %|V pořádku';
  r.vdWindows = vd.querySelectorAll('.vd-win').length === 2 && vd.querySelectorAll('.vd-h')[1].textContent === 'Okna (2)' && vd.querySelector('.vd-win .chip.low') && vd.querySelectorAll('.vd-win .chip').length === 2;
  r.vdChart = !!vd.querySelector('.vd-chart svg path[stroke="#E8592C"]') && wsCalls.at(-1).entity_ids.length === 3 && vd.querySelectorAll('.band').length === 0;
  r.vdStepEnabled = !vd.querySelector('[data-act="step"]').disabled;
  vd.querySelector('[data-d="1"]').click(); await tick();
  r.vdStep = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'climate', service: 'set_temperature', data: { entity_id: ids.dressing, temperature: 19.5 } }) && t('.tv') === '19,5 °C';
  vd.querySelector('[data-act="calibrate"]').click(); await tick();
  r.vdCalibrate = confirms.at(-1).startsWith('Kalibrovat hlavici?') && JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'script', service: `heating_calibrate_${C}`, data: { climate: ids.dressing } });
  vd.querySelector('[data-act="schedule"]').click(); await tick();
  r.vdSchedule = !vd.open && dlg.open && dlg.querySelector('heating-schedule-card').cfg.valve === ids.dressing;
  dlg.close(); await tick();
  // live: the valve's battery recovers while the dialog is open
  await press($$('.main')[7].querySelector('.dot')); await tick(100);
  card.hass = { ...hass, states: { ...states, 'sensor.dress_battery': { state: '90', attributes: { device_class: 'battery' } }, [`sensor.heating_low_batteries_${C}`]: { state: '0', attributes: { low_battery: [], list_low: [] } } } }; await tick();
  r.vdLive = t('.vd-tile .fv') === '90 %' && !vd.querySelector('.vd-alert') && !vd.querySelector('.vd-head .badge');
  card.hass = hass; await tick();
  vd.querySelector('[data-act="history"]').click(); await tick();
  r.vdHistory = !vd.open && infos.at(-1) === ids.dressing;
  vd.close();

  // window board (Dětský pokoj)
  await press($$('.main')[5].querySelector('.dot')); await tick(100);
  r.vdWindowAlert = t('.vd-alert') === 'Okno dětský pokoj otevřené 12 min · hlavice netopí, dokud se okno nezavře. Připomenu za 18 min.' && vd.querySelector('.vd-alert').classList.contains('info');
  r.vdWindowDisabled = [...vd.querySelectorAll('[data-act="step"]')].every((b) => b.disabled) && t('.vd-target .lbl') === 'Cíl · platí po zavření okna';
  const band = vd.querySelector('.vd-chart .band');
  r.vdBandWidth = !!band && Math.abs(Number(band.getAttribute('width')) - 3.7) < 0.6 && Number(band.getAttribute('x')) > 430;
  r.vdBand = vd.querySelectorAll('.vd-chart .band').length === 1 && t('.vd-win .ws') === 'Otevřené · 12 min' && vd.querySelector('.vd-win .dot.winopen') && !vd.querySelector('.vd-win .chip');
  card.hass = { ...hass, states: { ...states, 'binary_sensor.kids_window': { state: 'unavailable', attributes: {} }, [`sensor.heating_off_schedule_${C}`]: { state: '2', attributes: { ...states[`sensor.heating_off_schedule_${C}`].attributes, window_open_climates: [], windows: { [ids.kids]: [{ entity_id: 'binary_sensor.kids_window', name: 'Okno dětský pokoj', state: 'unavailable', open: false, since, battery: null }] } } } } };
  await tick();
  r.vdUnavailable = t('.vd-win .ws') === 'Čidlo nedostupné' && !vd.querySelector('.vd-alert');
  card.hass = hass; vd.close(); await tick();
  // pointer gate + stable nodes: a hass update while a pointer is down in the dialog waits; the stepper keeps its nodes
  await press($$('.main')[7].querySelector('.dot')); await tick(100);
  const plus = vd.querySelector('[data-d="1"]'), foot = vd.querySelector('[data-act="calibrate"]');
  const batTxt = () => t('.vd-tile .fv');
  ptr(plus, 'pointerdown');
  card.hass = { ...hass, states: { ...states, 'sensor.dress_battery': { state: '55', attributes: { device_class: 'battery' } } } }; await tick();
  r.vdGate = batTxt() === '14 %';
  ptr(plus, 'pointerup'); await tick(50);
  r.vdGateFlush = batTxt() === '55 %' && vd.querySelector('[data-d="1"]') === plus && vd.querySelector('[data-act="calibrate"]') === foot;
  const sameHtml = vd.querySelector('.vd-facts').innerHTML;
  card.hass = { ...hass, states: { ...states, 'sensor.dress_battery': { state: '55', attributes: { device_class: 'battery' } }, 'sensor.unrelated': { state: '2', attributes: {} } } }; await tick();
  r.vdUnrelated = vd.querySelector('.vd-facts').innerHTML === sameHtml;
  card.hass = hass; await tick();
  // backdrop: padding is inside the sheet and does not close it; a click outside its box does
  const rect = vd.getBoundingClientRect();
  vd.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true, clientX: rect.left + 3, clientY: rect.top + 3 }));
  r.vdPaddingStays = vd.open;
  vd.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true, clientX: rect.left - 10, clientY: rect.top + 50 }));
  r.vdBackdropCloses = !vd.open;
  // disconnect closes the dialog and stops its timers
  await press($$('.main')[7].querySelector('.dot')); await tick(100);
  const host = card.parentNode; host.removeChild(card); await tick();
  r.vdDisconnect = !vd.open;
  host.appendChild(card); await tick(50);
  r.vdReconnect = !vd.open && $$('.tile').length === 8;
  // the close button
  await press($$('.main')[0].querySelector('.dot')); await tick(100);
  vd.querySelector('[data-act="close"]').click(); await tick();
  r.vdClose = !vd.open;
  // a failing history leaves the dialog usable
  card.hass = { ...hass, callWS: async () => { throw new Error('no history'); } };
  await press($$('.main')[0].querySelector('.dot')); await tick(100);
  r.vdNoHistory = vd.open && t('.chart-msg') === 'Historie není k dispozici.' && !!vd.querySelector('.vd-foot');
  vd.close(); await tick();

  // program dialog (V6-Program)
  const gd = $('dialog.gd');
  const g = (sel) => gd.querySelector(sel);
  $('[data-act="open"][data-val="program"]').click(); await tick(50);
  r.pdOpen = gd.open && g('.vd-title').textContent === 'Program' && g('.sub').textContent === 'Topení přízemí' && !vd.open;
  r.pdRows = gd.querySelectorAll('[role="radio"]').length === 5 && gd.querySelectorAll('[role="radio"][aria-checked="true"]').length === 1 && g('[aria-checked="true"] .n').textContent === 'Víkend' && g('[aria-checked="true"] .dot.heat') !== null;
  r.pdAutoLine = g('[data-val="auto"] .d').textContent === 'rozvrh hlavic · lichý týden';
  g('[data-val="vacation"]').click(); await tick();
  r.pdSelect = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'select', service: 'select_option', data: { entity_id: `select.heating_program_${C}`, option: 'vacation' } });
  const nCall = calls.length;
  g('[data-val="vacation"]').click(); await tick(); // the pending program is the current one
  r.pdSameNoCall = calls.length === nCall;
  g('[data-act="alternation"]').click(); await tick();
  r.pdAlternation = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_boolean', service: 'toggle', data: { entity_id: `input_boolean.heating_week_alternation_${C}` } });
  g('[data-act="holidays"][data-val="none"]').click(); await tick();
  r.pdHolidays = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_select', service: 'select_option', data: { entity_id: `input_select.heating_holidays_${C}`, option: 'none' } });
  const sel = g('[data-act="calendar"]');
  r.pdCalendarShown = sel.value === 'calendar.holidays_cz' && g('.sel + .help').textContent === 'Další: 17. 11. Den boje za svobodu';
  sel.value = ''; sel.dispatchEvent(new Event('change', { bubbles: true, composed: true })); await tick();
  r.pdCalendar = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_text', service: 'set_value', data: { entity_id: `input_text.heating_holiday_calendar_${C}`, value: '' } });
  r.pdTiles = /^6 ze 8\|dnes \d+:\d\d$/.test([...gd.querySelectorAll('.vd-tile .fv')].map((e) => e.textContent).join('|'));
  // live: hass updates the dialog in place (progress, holidays off hides the calendar row, the sync button spins)
  const prog = g('.prog');
  card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'program', left: 4 } }, [`input_select.heating_holidays_${C}`]: { state: 'none', attributes: states[`input_select.heating_holidays_${C}`].attributes } } }; await tick();
  r.pdLive = g('.vd-alert').textContent.replace(/\s+/g, ' ').trim() === 'Nastavuji hlavice podle programu Dovolená · 4 ze 8' && !g('[data-act="calendar"]') && g('[data-act="holidays"][data-val="none"]').getAttribute('aria-pressed') === 'true';
  card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'sync', left: 4 } } } }; await tick();
  r.pdSyncing = g('[data-act="sync"]').disabled && !!g('[data-act="sync"] .spin') && g('.vd-alert').textContent.includes('Srovnávám hlavice');
  card.hass = hass; await tick();
  g('[data-act="sync"]').click(); await tick();
  r.pdSyncCall = JSON.stringify(calls.at(-1)) === JSON.stringify({ domain: 'input_button', service: 'press', data: { entity_id: `input_button.heating_sync_${C}` } });
  // a pointer down in the dialog defers the render; an unrelated update rebuilds nothing
  const rows = g('.prog');
  card.hass = { ...hass, states: { ...states, 'sensor.unrelated': { state: '3', attributes: {} } } }; await tick();
  r.pdNoRebuild = g('.prog') === rows;
  // quick double tap: the second tap on the pending program is a no-op; the pending shows as current
  const nQuick = calls.length;
  g('[data-val="home_office"]').click(); g('[data-val="home_office"]').click(); await tick();
  r.pdDoubleTap = calls.length === nQuick + 1 && g('[aria-checked="true"] .n').textContent === 'Home office';
  g('[data-act="holidays"][data-val="calendar"]').click(); await tick(); // already pressed: no call
  r.pdHolidaysSame = calls.length === nQuick + 1;
  // an open select is not rebuilt by a hass update; the update lands when it loses focus
  const sel2 = g('[data-act="calendar"]');
  sel2.dispatchEvent(new FocusEvent('focusin', { bubbles: true, composed: true }));
  card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'program', left: 5 } } } }; await tick();
  card.hass = { ...hass, states: { ...states, [`sensor.heating_applying_${C}`]: { state: 'applying', attributes: { trigger: 'program', left: 4 } } } }; await tick();
  r.pdSelectKept = g('[data-act="calendar"]') === sel2 && !g('.vd-alert');
  sel2.dispatchEvent(new FocusEvent('focusout', { bubbles: true, composed: true })); await tick(50);
  r.pdSelectFlush = g('[data-act="calendar"]') !== sel2 && g('.vd-alert').textContent.includes('4 ze 8');
  r.pdLabel = gd.getAttribute('aria-label') === 'Program';
  card.hass = hass; await tick();
  // Upravit programy: the dialog closes, the schedule dialog opens for the first valve
  g('[data-act="programs"]').click(); await tick();
  r.pdPrograms = !gd.open && dlg.open && dlg.querySelector('heating-schedule-card').cfg.valve === valveIds[0];
  dlg.close(); await tick();
  // the x closes it; a missing program helper set still renders (no select = only `auto`)
  $('[data-act="open"][data-val="program"]').click(); await tick(50);
  g('[data-act="gclose"]').click(); await tick();
  r.pdClose = !gd.open;
  const poor = structuredClone(states);
  for (const id of Object.keys(poor)) if (/heating_(week|holiday|schedule)|^calendar\.|^select\.heating_program/.test(id)) delete poor[id];
  card.hass = { ...hass, states: poor }; await tick();
  $('[data-act="open"][data-val="program"]').click(); await tick(50);
  r.pdMissing = gd.open && gd.querySelectorAll('[role="radio"]').length === 1 && !g('[data-act="alternation"]') && !g('[data-act="holidays"]');
  gd.close(); card.hass = hass; await tick();
  // disconnect closes it
  $('[data-act="open"][data-val="program"]').click(); await tick(50);
  const host2 = card.parentNode; host2.removeChild(card); await tick();
  r.pdDisconnect = !gd.open;
  host2.appendChild(card); await tick(50);

  r.noErrors = errors.length === 0;
  const ok = Object.values(r).every(Boolean);
  document.getElementById('out').textContent = 'RESULT ' + (ok ? 'OK ' : 'FAIL ') + JSON.stringify(r) + (errors.length ? ' ERRORS ' + JSON.stringify(errors) : '');
</script>
</body>
</html>
